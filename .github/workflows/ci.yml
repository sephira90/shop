name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Full Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop_test
          MYSQL_USER: shop
          MYSQL_PASSWORD: shop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit composer dependencies
        run: composer audit

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "file_exists('database/testing.sqlite') || touch('database/testing.sqlite');"

      - name: Run backend quality checks
        run: composer run quality:backend

      - name: Run frontend quality checks
        run: composer run quality:frontend

      - name: Run production smoke checks
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: shop_test
          DB_USERNAME: shop
          DB_PASSWORD: shop
          CACHE_STORE: database
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          php artisan migrate --force
          composer run ops:ci-production-smoke
